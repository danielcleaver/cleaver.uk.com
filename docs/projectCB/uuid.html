<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>random uuid</title>
    <script>
    function uuidv4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);

            return v.toString(16);
        });
    }
    </script>

</head>
<body>

    <h1 id="uuid" onclick="navigator.clipboard.writeText(this.innerHTML);" style="cursor: pointer;"></h1>

    <script>
        console.log(uuidv4());
        document.getElementById('uuid').innerHTML=uuidv4();
    </script>

</body>
</html>
